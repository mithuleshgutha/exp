<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts – OpTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .acct-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }
        .acct-name { font-weight: 700; font-size: 15px; }
        .acct-meta { font-size: 12px; color: #888; margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
        .acct-net  { font-weight: 700; font-size: 17px; }
    </style>
</head>
<body>

<div class="app-header d-flex align-items-center justify-content-between px-3 py-2">
    <div>
        <div class="fw-bold" style="font-size:17px">Accounts</div>
        <div class="text-muted" style="font-size:12px" id="userLabel"></div>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
            <i class="bi bi-plus-lg me-1"></i>Add
        </button>
        <button class="btn btn-sm btn-outline-secondary" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
        </button>
    </div>
</div>

<div class="page-content" id="accountList">
    <div class="text-center text-muted py-5">
        <div class="spinner-border spinner-border-sm mb-2"></div><br>Loading…
    </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
    <a href="/dashboard.html">
        <i class="bi bi-house-fill"></i><span>Home</span>
    </a>
    <a href="/transactions.html">
        <i class="bi bi-receipt"></i><span>Transactions</span>
    </a>
    <a href="/expenses.html">
        <i class="bi bi-cash-stack"></i><span>Expenses</span>
    </a>
    <a href="/customers.html">
        <i class="bi bi-people"></i><span>Customers</span>
    </a>
    <a href="/accounts.html" class="active">
        <i class="bi bi-wallet2"></i><span>Accounts</span>
    </a>
    <a href="/stock.html">
        <i class="bi bi-boxes"></i><span>Stock</span>
    </a>
    <a href="/users.html" id="navUsers" style="display:none">
        <i class="bi bi-shield-lock"></i><span>Users</span>
    </a>
</nav>
<script>if (localStorage.getItem("userRole") === "admin") document.getElementById("navUsers").style.display = "";</script>

<!-- Add Account Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">New Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label fw-semibold small">Account Name <span class="text-danger">*</span></label>
                <input type="text" id="acctName" class="form-control" placeholder="e.g. HDFC Bank">
                <div class="text-danger small mt-1" id="addErr"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="createAccount()">Create</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const token = localStorage.getItem("token");
    if (!token) location.href = "/login.html";
    document.getElementById("userLabel").textContent = localStorage.getItem("userName") || "";
    function logout() { localStorage.clear(); location.href = "/login.html"; }

    const fmt = n => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 });
    const authH = () => ({ "Content-Type": "application/json", Authorization: `Bearer ${token}` });

    function render(accounts) {
        const el = document.getElementById("accountList");
        if (!accounts.length) {
            el.innerHTML = `<div class="text-center text-muted py-5">No accounts yet.</div>`;
            return;
        }
        el.innerHTML = accounts.map(a => {
            const totalIn  = parseFloat(a.total_in)  || 0;
            const totalOut = parseFloat(a.total_out) || 0;
            const net      = totalIn - totalOut;
            return `
            <div class="acct-card" style="cursor:pointer" onclick="location.href='/account-ledger.html?id=${a.id}'">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="acct-name"><i class="bi bi-wallet2 me-2 text-muted"></i>${a.name}</div>
                    <div class="d-flex align-items-center gap-2">
                        <div class="acct-net" style="color:${net>=0?'#1a7c2a':'#c0392b'}">${net<0?'-':''}${fmt(Math.abs(net))}</div>
                        <i class="bi bi-chevron-right text-muted"></i>
                    </div>
                </div>
                <div class="acct-meta">
                    <span><i class="bi bi-arrow-down-circle-fill text-success me-1"></i>In ${fmt(totalIn)}</span>
                    <span><i class="bi bi-arrow-up-circle-fill text-danger me-1"></i>Out ${fmt(totalOut)}</span>
                </div>
            </div>`;
        }).join("");
    }

    async function load() {
        try {
            const r = await fetch("/api/accounts", { headers: authH() });
            if (!r.ok) { location.href = "/login.html"; return; }
            render(await r.json());
        } catch {
            document.getElementById("accountList").innerHTML =
                `<div class="text-danger text-center py-4">Failed to load accounts.</div>`;
        }
    }

    const addModal = bootstrap.Modal.getOrCreateInstance(document.getElementById("addModal"));

    async function createAccount() {
        const name = document.getElementById("acctName").value.trim();
        const errEl = document.getElementById("addErr");
        errEl.textContent = "";
        if (!name) { errEl.textContent = "Name required."; return; }
        try {
            const r = await fetch("/api/accounts", {
                method: "POST", headers: authH(), body: JSON.stringify({ name })
            });
            const d = await r.json();
            if (!r.ok) { errEl.textContent = d.error; return; }
            document.getElementById("acctName").value = "";
            addModal.hide();
            load();
        } catch { errEl.textContent = "Error. Try again."; }
    }

    document.getElementById("addModal").addEventListener("hidden.bs.modal", () => {
        document.getElementById("acctName").value = "";
        document.getElementById("addErr").textContent = "";
    });

    load();
</script>
</body>
</html>
