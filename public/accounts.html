<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts – OpTrack</title>
    <script>(function(){if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .acct-card {
            background: var(--surface);
            border-radius: 14px;
            padding: 16px 18px;
            margin-bottom: 10px;
            box-shadow: 0 2px 8px var(--shadow);
        }
        .acct-name { font-weight: 700; font-size: 15px; color: var(--text); }
        .acct-meta { font-size: 12px; color: var(--text-muted); margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
        .acct-net  { font-weight: 700; font-size: 17px; }
    </style>
</head>
<body>

<div class="app-header d-flex align-items-center justify-content-between px-3 py-2">
    <div>
        <div class="fw-bold" style="font-size:17px">Accounts</div>
        <div class="text-muted" style="font-size:12px" id="userLabel"></div>
    </div>
    <div class="d-flex gap-2">
        <button class="btn btn-sm btn-outline-primary" onclick="openTransferModal()">
            <i class="bi bi-arrow-left-right me-1"></i>Transfer
        </button>
        <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
            <i class="bi bi-plus-lg me-1"></i>Add
        </button>
        <a href="/profit-estimator.html" class="theme-toggle" title="Profit Estimator">
            <i class="bi bi-calculator-fill"></i>
        </a>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
            <i class="bi bi-moon-fill"></i><i class="bi bi-sun-fill"></i>
        </button>
        <button class="btn btn-sm btn-outline-secondary" onclick="logout()">
            <i class="bi bi-box-arrow-right"></i>
        </button>
    </div>
</div>

<div class="page-content" id="accountList">
    <div class="text-center text-muted py-5">
        <div class="spinner-border spinner-border-sm mb-2"></div><br>Loading…
    </div>
</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
    <a href="/dashboard.html">
        <i class="bi bi-house-fill"></i><span>Home</span>
    </a>
    <a href="/transactions.html">
        <i class="bi bi-receipt"></i><span>Transactions</span>
    </a>
    <a href="/expenses.html">
        <i class="bi bi-cash-stack"></i><span>Expenses</span>
    </a>
    <a href="/customers.html">
        <i class="bi bi-people"></i><span>Customers</span>
    </a>
    <a href="/accounts.html" class="active">
        <i class="bi bi-wallet2"></i><span>Accounts</span>
    </a>
    <a href="/stock.html">
        <i class="bi bi-boxes"></i><span>Stock</span>
    </a>
    <a href="/users.html" id="navUsers" style="display:none">
        <i class="bi bi-shield-lock"></i><span>Users</span>
    </a>
</nav>
<script>if (localStorage.getItem("userRole") === "admin") document.getElementById("navUsers").style.display = "";</script>

<!-- Add Account Modal -->
<div class="modal fade" id="addModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">New Account</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <label class="form-label fw-semibold small">Account Name <span class="text-danger">*</span></label>
                <input type="text" id="acctName" class="form-control" placeholder="e.g. HDFC Bank">
                <div class="text-danger small mt-1" id="addErr"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="createAccount()">Create</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/js/theme.js"></script>
<script>
    const token = localStorage.getItem("token");
    if (!token) location.href = "/login.html";
    document.getElementById("userLabel").textContent = localStorage.getItem("userName") || "";
    function logout() { localStorage.clear(); location.href = "/login.html"; }

    const fmt = n => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 0 });
    const authH = () => ({ "Content-Type": "application/json", Authorization: `Bearer ${token}` });

    function render(accounts) {
        _accounts = accounts;
        const el = document.getElementById("accountList");
        if (!accounts.length) {
            el.innerHTML = `<div class="text-center text-muted py-5">No accounts yet.</div>`;
            return;
        }
        el.innerHTML = accounts.map(a => {
            const ob        = parseFloat(a.opening_balance) || 0;
            const totalIn   = parseFloat(a.total_in)        || 0;
            const totalOut  = parseFloat(a.total_out)       || 0;
            const totalExp  = parseFloat(a.total_expense)   || 0;
            const net       = ob + totalIn - totalOut - totalExp;
            return `
            <div class="acct-card">
                <div class="d-flex justify-content-between align-items-center" style="cursor:pointer" onclick="location.href='/account-ledger.html?id=${a.id}'">
                    <div class="acct-name"><i class="bi bi-wallet2 me-2 text-muted"></i>${a.name}</div>
                    <div class="d-flex align-items-center gap-2">
                        <div class="acct-net" style="color:${net>=0?'#1a7c2a':'#c0392b'}">${net<0?'-':''}${fmt(Math.abs(net))}</div>
                        <i class="bi bi-chevron-right text-muted"></i>
                    </div>
                </div>
                <div class="acct-meta">
                    ${ob ? `<span><i class="bi bi-hourglass-split me-1" style="color:#8b5e3c"></i>OB ${fmt(ob)}</span>` : ""}
                    <span><i class="bi bi-arrow-down-circle-fill text-success me-1"></i>In ${fmt(totalIn)}</span>
                    <span><i class="bi bi-arrow-up-circle-fill text-danger me-1"></i>Out ${fmt(totalOut)}</span>
                    ${totalExp ? `<span><i class="bi bi-receipt text-warning me-1"></i>Exp ${fmt(totalExp)}</span>` : ""}
                </div>
                <div class="mt-2 pt-2" style="border-top:1px solid #f0ece8">
                    <button class="btn btn-sm btn-outline-secondary w-100" onclick="openOBModal(${a.id},'${a.name.replace(/'/g,"\\'")}',${ob})">
                        <i class="bi bi-pencil me-1"></i>Edit Opening Balance
                    </button>
                </div>
            </div>`;
        }).join("");
    }

    async function load() {
        try {
            const r = await fetch("/api/accounts", { headers: authH() });
            if (!r.ok) { localStorage.clear(); location.href = "/login.html"; return; }
            render(await r.json());
        } catch {
            document.getElementById("accountList").innerHTML =
                `<div class="text-danger text-center py-4">Failed to load accounts.</div>`;
        }
    }

    const addModal = bootstrap.Modal.getOrCreateInstance(document.getElementById("addModal"));

    async function createAccount() {
        const name = document.getElementById("acctName").value.trim();
        const errEl = document.getElementById("addErr");
        errEl.textContent = "";
        if (!name) { errEl.textContent = "Name required."; return; }
        try {
            const r = await fetch("/api/accounts", {
                method: "POST", headers: authH(), body: JSON.stringify({ name })
            });
            const d = await r.json();
            if (!r.ok) { errEl.textContent = d.error; return; }
            document.getElementById("acctName").value = "";
            addModal.hide();
            load();
        } catch { errEl.textContent = "Error. Try again."; }
    }

    document.getElementById("addModal").addEventListener("hidden.bs.modal", () => {
        document.getElementById("acctName").value = "";
        document.getElementById("addErr").textContent = "";
    });

    load();

    let _accounts = [];

    function openTransferModal() {
        const fromSel = document.getElementById("trFrom");
        const toSel   = document.getElementById("trTo");
        fromSel.innerHTML = _accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
        toSel.innerHTML   = _accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join("");
        if (_accounts.length > 1) toSel.value = _accounts[1].id;
        document.getElementById("trAmount").value = "";
        document.getElementById("trNotes").value  = "";
        document.getElementById("trErr").textContent = "";
        bootstrap.Modal.getOrCreateInstance(document.getElementById("transferModal")).show();
    }

    let _transferring = false;
    async function doTransfer() {
        if (_transferring) return;
        const from   = parseInt(document.getElementById("trFrom").value);
        const to     = parseInt(document.getElementById("trTo").value);
        const amount = parseFloat(document.getElementById("trAmount").value);
        const notes  = document.getElementById("trNotes").value.trim();
        const errEl  = document.getElementById("trErr");
        const btn    = document.getElementById("trSubmitBtn");
        errEl.textContent = "";
        if (from === to)      { errEl.textContent = "From and To must be different."; return; }
        if (!amount || amount <= 0) { errEl.textContent = "Enter a valid amount."; return; }
        _transferring = true;
        btn.disabled = true;
        btn.textContent = "Transferring…";
        try {
            const r = await fetch("/api/accounts/transfer", {
                method: "POST", headers: authH(),
                body: JSON.stringify({ from_account_id: from, to_account_id: to, amount, notes: notes || null })
            });
            const d = await r.json();
            if (!r.ok) { errEl.textContent = d.error || "Transfer failed."; return; }
            bootstrap.Modal.getInstance(document.getElementById("transferModal")).hide();
            load();
        } catch { errEl.textContent = "Error. Try again."; }
        finally {
            _transferring = false;
            btn.disabled = false;
            btn.textContent = "Transfer";
        }
    }

    let _obAccountId = null;
    function openOBModal(id, name, current) {
        _obAccountId = id;
        document.getElementById("obAcctName").textContent = name;
        document.getElementById("obInput").value = current || "";
        bootstrap.Modal.getOrCreateInstance(document.getElementById("obModal")).show();
    }
    async function saveOB() {
        const val = parseFloat(document.getElementById("obInput").value);
        if (isNaN(val)) { alert("Enter a valid number."); return; }
        try {
            const r = await fetch(`/api/accounts/${_obAccountId}/opening-balance`, {
                method: "PATCH", headers: authH(), body: JSON.stringify({ opening_balance: val })
            });
            if (!r.ok) throw new Error();
            bootstrap.Modal.getInstance(document.getElementById("obModal")).hide();
            load();
        } catch { alert("Failed to update."); }
    }
</script>

<!-- Opening Balance Modal -->
<div class="modal fade" id="obModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" style="max-width:340px">
        <div class="modal-content p-4">
            <h5 class="fw-bold mb-1">Opening Balance</h5>
            <p class="text-muted small mb-3" id="obAcctName"></p>
            <label class="form-label fw-semibold small">Amount (₹)</label>
            <input type="number" id="obInput" class="form-control mb-3" placeholder="0.00">
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary flex-grow-1" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary flex-grow-1" onclick="saveOB()">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- Transfer Modal -->
<div class="modal fade" id="transferModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" style="max-width:380px">
        <div class="modal-content p-4">
            <h5 class="fw-bold mb-3"><i class="bi bi-arrow-left-right me-2"></i>Transfer Between Accounts</h5>
            <div class="mb-3">
                <label class="form-label fw-semibold small">From <span class="text-danger">*</span></label>
                <select id="trFrom" class="form-select"></select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">To <span class="text-danger">*</span></label>
                <select id="trTo" class="form-select"></select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">Amount (₹) <span class="text-danger">*</span></label>
                <input type="number" id="trAmount" class="form-control" placeholder="0.00" min="0">
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">Notes (optional)</label>
                <input type="text" id="trNotes" class="form-control" placeholder="e.g. Advance payment">
            </div>
            <div class="text-danger small mb-2" id="trErr"></div>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary flex-grow-1" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary flex-grow-1" id="trSubmitBtn" onclick="doTransfer()">Transfer</button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
