<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – OpTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background: #f8f5f2;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-card {
            background: #fff;
            border: none;
            border-radius: 20px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.09);
            padding: 40px 32px;
            width: 100%;
            max-width: 380px;
        }
        .brand-icon {
            width: 68px;
            height: 68px;
            background: #8b5e3c;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            font-size: 34px;
            color: #fff;
        }
        .form-control:focus {
            border-color: #8b5e3c;
            box-shadow: 0 0 0 0.2rem rgba(139,94,60,0.15);
        }
        .btn-login {
            background: #8b5e3c;
            border: none;
            color: #fff;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
            transition: background 0.15s;
        }
        .btn-login:hover { background: #a47350; }
        .err { color: #dc3545; font-size: 13px; text-align: center; margin-top: 10px; min-height: 18px; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand-icon"><i class="bi bi-boxes"></i></div>
        <h4 class="text-center fw-bold mb-1">OpTrack</h4>
        <p class="text-center text-muted mb-4" style="font-size:13px">Industrial Operations Tracker</p>

        <div class="mb-3">
            <label class="form-label fw-semibold small">Username</label>
            <input type="text" id="username" class="form-control" placeholder="Enter username" autocomplete="username">
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold small">Password</label>
            <div class="input-group">
                <input type="password" id="password" class="form-control" placeholder="Enter password" autocomplete="current-password">
                <button class="btn btn-outline-secondary" type="button" id="togglePwd" tabindex="-1">
                    <i class="bi bi-eye" id="eyeIcon"></i>
                </button>
            </div>
        </div>

        <button class="btn-login" id="loginBtn" onclick="login()">
            <i class="bi bi-box-arrow-in-right me-2"></i>Login
        </button>
        <div class="err" id="errMsg"></div>
    </div>

    <script>
        if (localStorage.getItem("token")) {
            window.location.href = "/transactions.html";
        }

        document.getElementById("togglePwd").addEventListener("click", () => {
            const pwd = document.getElementById("password");
            const icon = document.getElementById("eyeIcon");
            if (pwd.type === "password") {
                pwd.type = "text";
                icon.className = "bi bi-eye-slash";
            } else {
                pwd.type = "password";
                icon.className = "bi bi-eye";
            }
        });

        document.addEventListener("keydown", (e) => {
            if (e.key === "Enter") login();
        });

        async function login() {
            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const errMsg   = document.getElementById("errMsg");
            const btn      = document.getElementById("loginBtn");

            errMsg.textContent = "";

            if (!username || !password) {
                errMsg.textContent = "Please enter username and password.";
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Logging in…';

            try {
                const res = await fetch("/api/auth/login", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (!res.ok) {
                    errMsg.textContent = data.error || "Invalid credentials";
                    return;
                }

                localStorage.setItem("token", data.token);
                localStorage.setItem("userName", data.name);
                localStorage.setItem("userUsername", data.username);
                window.location.href = "/transactions.html";

            } catch {
                errMsg.textContent = "Connection error. Please try again.";
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-box-arrow-in-right me-2"></i>Login';
            }
        }
    </script>
</body>
</html>
