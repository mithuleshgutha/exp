<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ledger – OpTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="container" style="max-width:620px">

    <!-- Header -->
    <div class="page-header">
        <div class="d-flex align-items-center gap-2">
            <a href="/customers.html" class="btn btn-sm" style="background:#f0ebe6;color:#8b5e3c">
                <i class="bi bi-arrow-left"></i>
            </a>
            <h4 class="mb-0">Ledger</h4>
        </div>
        <div class="d-flex align-items-center gap-2">
            <small class="text-muted" id="userLabel"></small>
            <button class="btn btn-sm btn-outline-secondary" onclick="logout()" title="Logout">
                <i class="bi bi-box-arrow-right"></i>
            </button>
        </div>
    </div>

    <!-- Customer summary card -->
    <div id="custCard" class="card p-3 mb-3" style="display:none">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <div class="cust-id mb-1" id="custUid"></div>
                <div class="fw-bold fs-5" id="custName"></div>
                <small class="text-muted" id="custPhone"></small>
            </div>
            <div class="text-end">
                <div class="small text-muted mb-1">Net Balance</div>
                <div class="fs-4 fw-bold" id="custBal"></div>
                <small class="text-muted" id="balNote"></small>
            </div>
        </div>
    </div>

    <!-- Spinner -->
    <div id="spinner" class="text-center py-5 text-muted">
        <div class="spinner-border" style="color:#8b5e3c"></div>
    </div>

    <!-- Ledger list -->
    <div id="txList"></div>
    <div id="emptyState" class="empty-state" style="display:none">
        <i class="bi bi-inbox"></i>
        <p>No transactions for this customer</p>
    </div>

</div>

<!-- Bottom Nav -->
<nav class="bottom-nav">
    <a href="/transactions.html">
        <i class="bi bi-receipt"></i><span>Transactions</span>
    </a>
    <a href="/customers.html" class="active">
        <i class="bi bi-people"></i><span>Customers</span>
    </a>
    <a href="/stock.html">
        <i class="bi bi-boxes"></i><span>Stock</span>
    </a>
</nav>

<!-- ═══════════════ Edit Transaction Modal ═══════════════ -->
<div class="modal fade" id="txModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">Edit Transaction</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">

                <!-- Customer -->
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Customer <span class="text-danger">*</span></label>
                    <div class="ac-wrap">
                        <input type="text" id="custInput" class="form-control" placeholder="Customer name…"
                               oninput="onCustInput()" autocomplete="off">
                        <div id="custDropdown" class="ac-dropdown" style="display:none"></div>
                    </div>
                    <div id="newCustHint" class="new-cust-hint">
                        <i class="bi bi-person-plus-fill me-1"></i>New customer — will be created on save
                    </div>
                    <input type="hidden" id="custId">
                </div>

                <!-- Category -->
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Category <span class="text-danger">*</span></label>
                    <div class="cat-group">
                        <button type="button" class="cat-btn active" data-cat="drip"    onclick="onCatChange('drip')">Drip</button>
                        <button type="button" class="cat-btn"        data-cat="dhana"   onclick="onCatChange('dhana')">Dhana</button>
                        <button type="button" class="cat-btn"        data-cat="scrap"   onclick="onCatChange('scrap')">Scrap</button>
                        <button type="button" class="cat-btn"        data-cat="payment" onclick="onCatChange('payment')">Payment</button>
                    </div>
                </div>

                <!-- Sale / Purchase (Dhana & Scrap) -->
                <div class="mb-3" id="saleTypeRow" style="display:none">
                    <label class="form-label fw-semibold small">Type <span class="text-danger">*</span></label>
                    <select id="salePurchase" class="form-select">
                        <option value="SALE">Sale</option>
                        <option value="PURCHASE">Purchase</option>
                    </select>
                </div>

                <!-- Payment type -->
                <div class="mb-3" id="payTypeRow" style="display:none">
                    <label class="form-label fw-semibold small">Payment Type <span class="text-danger">*</span></label>
                    <select id="payType" class="form-select" onchange="onPayTypeChange()">
                        <option value="PAYMENT_IN">Payment In (Customer paid you)</option>
                        <option value="PAYMENT_OUT">Payment Out (You paid customer)</option>
                    </select>
                </div>

                <!-- Stock inputs -->
                <div id="stockRow" class="mb-3">
                    <div class="row g-2">
                        <div class="col" id="qtyCol">
                            <label class="form-label fw-semibold small">Quantity</label>
                            <input type="number" id="qty" class="form-control" placeholder="0" min="0" oninput="calcTotal()">
                        </div>
                        <div class="col" id="metersCol">
                            <label class="form-label fw-semibold small">Meters</label>
                            <input type="number" id="meters" class="form-control" placeholder="0.00" min="0">
                        </div>
                        <div class="col" id="weightCol">
                            <label class="form-label fw-semibold small">Weight (kg)</label>
                            <input type="number" id="weight" class="form-control" placeholder="0.00" min="0">
                        </div>
                        <div class="col" id="bagsCol" style="display:none">
                            <label class="form-label fw-semibold small">Bags</label>
                            <input type="number" id="bags" class="form-control" placeholder="0" min="0" oninput="calcTotal()">
                        </div>
                    </div>
                </div>

                <!-- Rate -->
                <div class="mb-3" id="rateRow">
                    <label class="form-label fw-semibold small" id="rateLabel">Rate (₹/unit)</label>
                    <input type="number" id="rate" class="form-control" placeholder="0.00" min="0" oninput="calcTotal()">
                </div>

                <!-- Drip: calc method -->
                <div class="mb-2" id="calcMethodRow" style="display:none">
                    <label class="form-label fw-semibold small">Calculate Using</label>
                    <select id="calcMethod" class="form-select form-select-sm" onchange="calcTotal()">
                        <option value="weight">Quantity × Weight × Rate</option>
                        <option value="meters">Quantity × Meters × Rate</option>
                    </select>
                </div>

                <!-- Drip: editable amount -->
                <div class="mb-3" id="totalInputRow" style="display:none">
                    <label class="form-label fw-semibold small">
                        Amount (₹)
                        <small class="text-muted fw-normal ms-1">auto-calculated · editable</small>
                    </label>
                    <input type="number" id="totalInput" class="form-control" placeholder="0.00" min="0">
                </div>

                <!-- Dhana / Scrap: read-only total chip -->
                <div id="totalChip" class="mb-3 p-3 rounded-3" style="background:#f8f5f2;display:none">
                    <div class="d-flex justify-content-between">
                        <span class="fw-semibold">Total</span>
                        <span id="totalVal" class="fw-bold" style="color:#8b5e3c">₹0.00</span>
                    </div>
                </div>

                <!-- Paid -->
                <div class="mb-3">
                    <label class="form-label fw-semibold small" id="paidLabel">Amount Paid (₹)</label>
                    <input type="number" id="paid" class="form-control" placeholder="0.00" min="0">
                </div>

                <!-- Date -->
                <div class="mb-3">
                    <label class="form-label fw-semibold small">Date</label>
                    <input type="date" id="txDate" class="form-control">
                </div>

                <!-- Notes -->
                <div class="mb-1">
                    <label class="form-label fw-semibold small">Notes</label>
                    <textarea id="notes" class="form-control" rows="2" placeholder="Optional…"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary w-100 py-2 fw-semibold" onclick="updateTx()">
                    <i class="bi bi-check-lg me-2"></i>Update Transaction
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ═══════════════ Edit History Modal ═══════════════ -->
<div class="modal fade" id="historyModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-scrollable modal-dialog-centered">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-clock-history me-2" style="color:#8b5e3c"></i>Edit History
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="historyBody"></div>
        </div>
    </div>
</div>

<!-- ═══════════════ Delete Confirm Modal ═══════════════ -->
<div class="modal fade" id="deleteModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered" style="max-width:340px">
        <div class="modal-content text-center p-4">
            <div style="font-size:44px">🗑️</div>
            <h5 class="fw-bold mt-2">Delete Transaction?</h5>
            <p class="text-muted small">The transaction will remain visible here but be marked deleted.
               The balance will be reversed.</p>
            <div class="d-flex gap-2 mt-3">
                <button class="btn btn-outline-secondary flex-grow-1" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-danger flex-grow-1" id="confirmDeleteBtn">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
/* ── Auth ── */
const token = localStorage.getItem("token");
if (!token) location.href = "/login.html";
document.getElementById("userLabel").textContent = localStorage.getItem("userName") || "";
function logout() { localStorage.clear(); location.href = "/login.html"; }
const authHeaders = () => ({
    "Content-Type": "application/json",
    "Authorization": "Bearer " + token
});

const customerId = new URLSearchParams(location.search).get("id");
if (!customerId) location.href = "/customers.html";

/* ── State ── */
let customers  = [];
let txMap      = {};
let editingId  = null;
let deletingId = null;

/* ── Load customer ── */
async function loadCustomer() {
    try {
        const r = await fetch(`/api/customers/${customerId}`, { headers: authHeaders() });
        if (r.status === 401) { location.href = "/login.html"; return; }
        if (!r.ok) { location.href = "/customers.html"; return; }
        const c = await r.json();

        const uid    = c.customer_uid || ("CUS-" + String(c.id).padStart(4, "0"));
        const bal    = parseFloat(c.current_balance) || 0;
        const absBal = Math.abs(bal).toLocaleString("en-IN", { minimumFractionDigits: 2 });

        document.title = c.name + " – Ledger";
        document.getElementById("custUid").textContent   = uid;
        document.getElementById("custName").textContent  = c.name;
        document.getElementById("custPhone").textContent = c.phone || "";
        document.getElementById("custBal").textContent   = "₹" + absBal;
        document.getElementById("custBal").className     = "fs-4 fw-bold " + (bal >= 0 ? "bal-positive" : "bal-negative");
        document.getElementById("balNote").textContent   = bal >= 0 ? "Customer owes you" : "You owe customer";
        document.getElementById("custCard").style.display = "";
    } catch { /* ignore */ }
}

/* ── Load customers for autocomplete ── */
async function loadCustomers() {
    try {
        const r = await fetch("/api/customers", { headers: authHeaders() });
        if (r.ok) customers = await r.json();
    } catch { /* ignore */ }
}

/* ── Autocomplete ── */
function onCustInput() {
    const val  = document.getElementById("custInput").value.trim();
    const dd   = document.getElementById("custDropdown");
    const hint = document.getElementById("newCustHint");
    document.getElementById("custId").value = "";
    if (!val) { dd.style.display = "none"; hint.style.display = "none"; return; }
    const matches = customers.filter(c => c.name.toLowerCase().includes(val.toLowerCase()));
    if (matches.length) {
        dd.innerHTML = matches.map(c =>
            `<div class="ac-item" onclick="pickCustomer(${c.id},'${c.name.replace(/'/g,"\\'")}')">
                <span>${c.name}</span><span class="cust-id">${c.customer_uid||""}</span>
            </div>`).join("");
        dd.style.display = "block"; hint.style.display = "none";
    } else { dd.style.display = "none"; hint.style.display = "block"; }
}
function pickCustomer(id, name) {
    document.getElementById("custInput").value = name;
    document.getElementById("custId").value    = id;
    document.getElementById("custDropdown").style.display = "none";
    document.getElementById("newCustHint").style.display  = "none";
}
document.addEventListener("click", (e) => {
    if (!e.target.closest("#custInput") && !e.target.closest("#custDropdown"))
        document.getElementById("custDropdown").style.display = "none";
});

/* ── Category helpers ── */
function getCategory() {
    return document.querySelector(".cat-btn.active")?.dataset.cat || "drip";
}

function onCatChange(cat) {
    document.querySelectorAll(".cat-btn").forEach(b =>
        b.classList.toggle("active", b.dataset.cat === cat)
    );
    const isPayment = cat === "payment";
    document.getElementById("saleTypeRow").style.display = (cat === "dhana" || cat === "scrap") ? "" : "none";
    document.getElementById("payTypeRow").style.display  = isPayment ? "" : "none";
    document.getElementById("stockRow").style.display    = isPayment ? "none" : "";
    document.getElementById("rateRow").style.display     = isPayment ? "none" : "";
    document.getElementById("totalChip").style.display   = "none";
    document.getElementById("qtyCol").style.display       = (cat === "drip" || cat === "scrap") ? "" : "none";
    document.getElementById("metersCol").style.display    = cat === "drip" ? "" : "none";
    document.getElementById("weightCol").style.display    = cat === "drip" ? "" : "none";
    document.getElementById("bagsCol").style.display      = cat === "dhana" ? "" : "none";
    document.getElementById("calcMethodRow").style.display = cat === "drip" ? "" : "none";
    document.getElementById("totalInputRow").style.display = cat === "drip" ? "" : "none";
    document.getElementById("rateLabel").textContent      = cat === "dhana" ? "Rate (₹/bag)" : "Rate (₹/unit)";
    const payType = document.getElementById("payType").value;
    document.getElementById("paidLabel").textContent = isPayment
        ? (payType === "PAYMENT_IN" ? "Amount Received (₹)" : "Amount Paid to Customer (₹)")
        : "Amount Paid (₹)";
    calcTotal();
}

function onPayTypeChange() {
    const v = document.getElementById("payType").value;
    document.getElementById("paidLabel").textContent =
        v === "PAYMENT_IN" ? "Amount Received (₹)" : "Amount Paid to Customer (₹)";
}

function calcTotal() {
    const cat = getCategory();
    if (cat === "payment") { document.getElementById("totalChip").style.display = "none"; return; }

    if (cat === "drip") {
        const qty    = parseFloat(document.getElementById("qty").value)    || 0;
        const weight = parseFloat(document.getElementById("weight").value) || 0;
        const meters = parseFloat(document.getElementById("meters").value) || 0;
        const rt     = parseFloat(document.getElementById("rate").value)   || 0;
        const method = document.getElementById("calcMethod").value;
        const mult   = method === "weight" ? weight : meters;
        const suggested = qty * mult * rt;
        document.getElementById("totalInput").value = suggested ? suggested.toFixed(2) : "";
        document.getElementById("totalChip").style.display = "none";
        return;
    }

    const billing = cat === "dhana"
        ? (parseFloat(document.getElementById("bags").value) || 0)
        : (parseFloat(document.getElementById("qty").value)  || 0);
    const rt    = parseFloat(document.getElementById("rate").value) || 0;
    const total = billing * rt;
    document.getElementById("totalVal").textContent =
        "₹" + total.toLocaleString("en-IN", { minimumFractionDigits: 2 });
    document.getElementById("totalChip").style.display = (billing || rt) ? "" : "none";
}

/* ── Open Edit ── */
function openEdit(id) {
    const t = txMap[id];
    if (!t) return;
    editingId = id;

    // Reset fields
    ["custInput","qty","meters","weight","bags","rate","paid","notes","totalInput"]
        .forEach(i => document.getElementById(i).value = "");
    document.getElementById("custId").value        = "";
    document.getElementById("salePurchase").value  = "SALE";
    document.getElementById("payType").value       = "PAYMENT_IN";
    document.getElementById("calcMethod").value    = "weight";
    document.getElementById("custDropdown").style.display = "none";
    document.getElementById("newCustHint").style.display  = "none";

    document.getElementById("custInput").value = t.customer_name;
    document.getElementById("custId").value    = t.customer_id;

    let cat;
    if (t.transaction_type === "PAYMENT_IN" || t.transaction_type === "PAYMENT_OUT") {
        cat = "payment";
    } else {
        cat = t.item_type || (t.product ? t.product.toLowerCase() : "drip");
    }

    onCatChange(cat);

    if (cat === "payment") {
        document.getElementById("payType").value = t.transaction_type;
        onPayTypeChange();
    } else if (cat === "dhana" || cat === "scrap") {
        document.getElementById("salePurchase").value = t.transaction_type;
    }

    document.getElementById("qty").value    = parseFloat(t.quantity)    || "";
    document.getElementById("meters").value = parseFloat(t.meters)      || "";
    document.getElementById("weight").value = parseFloat(t.weight)      || "";
    document.getElementById("bags").value   = parseFloat(t.bags)        || "";
    document.getElementById("rate").value   = parseFloat(t.rate)        || "";
    document.getElementById("paid").value   = parseFloat(t.paid_amount) || "";
    document.getElementById("notes").value  = t.notes || "";
    document.getElementById("txDate").value = t.created_at
        ? new Date(t.created_at).toISOString().slice(0, 10) : "";
    if (cat === "drip") {
        document.getElementById("totalInput").value = parseFloat(t.total) || "";
    }

    calcTotal();
    bootstrap.Modal.getOrCreateInstance(document.getElementById("txModal")).show();
}

/* ── Update Transaction ── */
async function updateTx() {
    const custName = document.getElementById("custInput").value.trim();
    if (!custName) { alert("Please enter a customer name."); return; }

    const cat = getCategory();
    const isPayment = cat === "payment";
    let txType;
    if (cat === "drip")         txType = "SALE";
    else if (cat === "payment") txType = document.getElementById("payType").value;
    else                        txType = document.getElementById("salePurchase").value;

    const body = {
        customer_name:    custName,
        customer_id:      document.getElementById("custId").value || null,
        transaction_type: txType,
        item_type:        isPayment ? null : cat,
        quantity:         (cat === "drip" || cat === "scrap")
                            ? (parseFloat(document.getElementById("qty").value)  || 0) : 0,
        meters:           cat === "drip"  ? (parseFloat(document.getElementById("meters").value) || 0) : 0,
        weight:           cat === "drip"  ? (parseFloat(document.getElementById("weight").value) || 0) : 0,
        bags:             cat === "dhana" ? (parseFloat(document.getElementById("bags").value)   || 0) : 0,
        rate:             isPayment ? 0 : (parseFloat(document.getElementById("rate").value) || 0),
        total:            cat === "drip" ? (parseFloat(document.getElementById("totalInput").value) || null) : null,
        paid_amount:      parseFloat(document.getElementById("paid").value) || 0,
        notes:            document.getElementById("notes").value,
        created_at:       document.getElementById("txDate").value || null
    };

    try {
        const r = await fetch(`/api/transactions/${editingId}`, {
            method: "PUT", headers: authHeaders(), body: JSON.stringify(body)
        });
        if (!r.ok) throw new Error();
        editingId = null;
        bootstrap.Modal.getInstance(document.getElementById("txModal")).hide();
        await loadCustomer();
        loadLedger();
    } catch { alert("Error updating transaction. Please try again."); }
}

/* ── Delete ── */
function confirmDelete(id) {
    deletingId = id;
    document.getElementById("confirmDeleteBtn").onclick = async () => {
        try {
            const r = await fetch(`/api/transactions/${deletingId}`, {
                method: "DELETE", headers: authHeaders()
            });
            if (!r.ok) throw new Error();
            bootstrap.Modal.getInstance(document.getElementById("deleteModal")).hide();
            await loadCustomer();
            loadLedger();
        } catch { alert("Error deleting transaction."); }
    };
    bootstrap.Modal.getOrCreateInstance(document.getElementById("deleteModal")).show();
}

/* ── Edit History ── */
async function showHistory(id) {
    const histModal = bootstrap.Modal.getOrCreateInstance(document.getElementById("historyModal"));
    document.getElementById("historyBody").innerHTML =
        `<div class="text-center py-3"><div class="spinner-border spinner-border-sm"></div></div>`;
    histModal.show();

    try {
        const r = await fetch(`/api/transactions/${id}/history`, { headers: authHeaders() });
        const { edits, current } = await r.json();

        if (!edits.length) {
            document.getElementById("historyBody").innerHTML =
                `<p class="text-muted text-center py-3">No edit history found.</p>`;
            return;
        }

        const snapshots = [...edits.map(e => e.old_snapshot), current];
        const FIELD_LABELS = {
            customer_name:    "Customer",
            transaction_type: "Type",
            item_type:        "Category",
            quantity:         "Quantity",
            meters:           "Meters",
            weight:           "Weight (kg)",
            bags:             "Bags",
            rate:             "Rate",
            total:            "Total",
            paid_amount:      "Paid",
            pending_amount:   "Pending",
            notes:            "Notes",
            created_at:       "Date"
        };
        const fmt = (key, val) => {
            if (val === null || val === undefined || val === "") return "—";
            if (["total","rate","paid_amount","pending_amount"].includes(key))
                return "₹" + parseFloat(val).toLocaleString("en-IN", { minimumFractionDigits:2 });
            if (key === "created_at") return new Date(val).toLocaleDateString("en-IN");
            return String(val);
        };

        let html = `<div class="history-timeline">`;
        edits.forEach((edit, i) => {
            const oldSnap = snapshots[i], newSnap = snapshots[i + 1];
            const date = new Date(edit.edited_at).toLocaleString("en-IN",
                { day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit" });
            const changes = Object.keys(FIELD_LABELS)
                .filter(k => String(oldSnap[k] ?? "") !== String(newSnap[k] ?? ""))
                .map(k => `
                    <div class="h-change">
                        <span class="fw-semibold">${FIELD_LABELS[k]}:</span>
                        <span class="h-from ms-1">${fmt(k, oldSnap[k])}</span>
                        <i class="bi bi-arrow-right mx-1 text-muted" style="font-size:11px"></i>
                        <span class="h-to">${fmt(k, newSnap[k])}</span>
                    </div>`).join("");
            html += `
            <div class="h-item">
                <div class="h-date"><i class="bi bi-clock me-1"></i>${date}${edit.editor_name ? " · " + edit.editor_name : ""}</div>
                ${changes || `<div class="h-change text-muted">Details updated</div>`}
            </div>`;
        });
        html += `</div>`;
        document.getElementById("historyBody").innerHTML = html;
    } catch {
        document.getElementById("historyBody").innerHTML =
            `<p class="text-danger text-center py-3">Failed to load history.</p>`;
    }
}

/* ── Stock detail helper ── */
function stockDetail(t) {
    const cat = t.item_type || (t.product ? t.product.toLowerCase() : null);
    if (!cat) return "";
    if (cat === "drip") {
        const parts = [];
        if (parseFloat(t.quantity)) parts.push(parseFloat(t.quantity) + " pcs");
        if (parseFloat(t.meters))   parts.push(parseFloat(t.meters)   + " m");
        if (parseFloat(t.weight))   parts.push(parseFloat(t.weight)   + " kg");
        return "Drip" + (parts.length ? " · " + parts.join(" · ") : "");
    }
    if (cat === "dhana") {
        return "Dhana" + (parseFloat(t.bags) ? " · " + parseFloat(t.bags) + " bags" : "");
    }
    if (cat === "scrap") {
        return "Scrap" + (parseFloat(t.quantity) ? " · " + parseFloat(t.quantity) + " units" : "");
    }
    return t.product || "";
}

/* ── Render ── */
const TYPE_CFG = {
    SALE:        { label:"Sale",        cls:"badge-sale",     icon:"bi-arrow-up-right-circle-fill" },
    PURCHASE:    { label:"Purchase",    cls:"badge-purchase", icon:"bi-arrow-down-left-circle-fill" },
    PAYMENT_IN:  { label:"Payment In",  cls:"badge-pay-in",   icon:"bi-cash-coin" },
    PAYMENT_OUT: { label:"Payment Out", cls:"badge-pay-out",  icon:"bi-cash" }
};

function renderTx(t) {
    txMap[t.id] = t;
    const cfg       = TYPE_CFG[t.transaction_type] || { label: t.transaction_type, cls:"", icon:"bi-circle" };
    const isPayment = t.transaction_type === "PAYMENT_IN" || t.transaction_type === "PAYMENT_OUT";
    const isDeleted = !!t.deleted_at;
    const hasEdits  = parseInt(t.edit_count) > 0;
    const date      = new Date(t.created_at).toLocaleDateString("en-IN",
        { day:"2-digit", month:"short", year:"numeric" });
    const pending   = parseFloat(t.pending_amount);
    const detail    = stockDetail(t);

    return `
    <div class="card p-3 ${isDeleted ? "tx-deleted" : ""}" id="tx-${t.id}">
        <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="type-badge ${cfg.cls}">
                <i class="bi ${cfg.icon}"></i>${cfg.label}
            </span>
            <small class="text-muted">${date}</small>
        </div>
        <div class="d-flex justify-content-between align-items-end">
            <div>
                ${detail ? `<div class="text-muted small">${detail}</div>` : ""}
                ${t.notes ? `<small class="text-muted d-block mt-1">${t.notes}</small>` : ""}
            </div>
            <div class="text-end ms-3">
                ${isPayment
                    ? `<div class="fw-bold fs-6" style="color:#8b5e3c">₹${Number(t.paid_amount).toLocaleString("en-IN")}</div>`
                    : `<div class="fw-bold fs-6">₹${Number(t.total).toLocaleString("en-IN")}</div>
                       <small class="fw-semibold">Paid ₹${Number(t.paid_amount).toLocaleString("en-IN")}</small><br>
                       ${pending > 0
                           ? `<small class="text-danger">Pending ₹${pending.toLocaleString("en-IN")}</small>`
                           : `<small class="text-success"><i class="bi bi-check-circle me-1"></i>Cleared</small>`
                       }`
                }
            </div>
        </div>

        <!-- Action bar -->
        <div class="tx-actions">
            <div class="d-flex align-items-center gap-2">
                ${hasEdits
                    ? `<button class="edited-chip" onclick="showHistory(${t.id})">
                           <i class="bi bi-pencil-fill"></i>Edited
                       </button>` : ""}
                ${isDeleted
                    ? `<span class="deleted-chip"><i class="bi bi-x-circle-fill me-1"></i>Deleted</span>` : ""}
            </div>
            ${!isDeleted ? `
            <div class="d-flex gap-1">
                <button class="btn-icon" title="Edit" onclick="openEdit(${t.id})">
                    <i class="bi bi-pencil" style="color:#8b5e3c"></i>
                </button>
                <button class="btn-icon danger" title="Delete" onclick="confirmDelete(${t.id})">
                    <i class="bi bi-trash" style="color:#c0392b"></i>
                </button>
            </div>` : ""}
        </div>
    </div>`;
}

/* ── Load Ledger ── */
async function loadLedger() {
    document.getElementById("spinner").style.display    = "block";
    document.getElementById("emptyState").style.display = "none";
    document.getElementById("txList").innerHTML         = "";
    txMap = {};

    try {
        const r = await fetch(`/api/transactions/customer/${customerId}`, { headers: authHeaders() });
        if (r.status === 401) { location.href = "/login.html"; return; }

        const list = await r.json();
        document.getElementById("spinner").style.display = "none";

        if (!list.length) { document.getElementById("emptyState").style.display = "block"; return; }
        document.getElementById("txList").innerHTML = list.map(renderTx).join("");
    } catch {
        document.getElementById("spinner").style.display = "none";
        document.getElementById("txList").innerHTML =
            `<div class="text-center text-danger py-3">Failed to load ledger</div>`;
    }
}

/* ── Init ── */
loadCustomer();
loadCustomers();
loadLedger();
</script>
