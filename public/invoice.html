<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoice Generator – OpTrack</title>
    <script>(function(){if(localStorage.getItem('theme')==='dark')document.documentElement.setAttribute('data-theme','dark');})();</script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .est-card { background: var(--surface); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 2px 8px var(--shadow); }
        .est-card h6 { color: var(--primary); font-weight: 700; margin-bottom: 12px; }
        .item-row { border: 1px solid var(--border-soft); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
        .sum-row { display:flex; justify-content:space-between; padding:6px 0; font-size:14px; border-bottom:1px solid var(--border-soft); }
        .sum-row.total { font-size:18px; font-weight:800; border-bottom:none; }
        body { overflow-x: hidden; }
        .container { padding-bottom: 96px; }
        /* 16px inputs stop iOS Safari zooming the page on focus; taller tap targets */
        .form-control, .form-select { font-size: 16px; min-height: 44px; }
        .item-row .btn-outline-danger { min-height: 44px; }
        /* Generate button stays reachable at the bottom of the screen */
        .gen-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
                   background: var(--surface); box-shadow: 0 -2px 10px var(--shadow); }
        .gen-bar .btn { max-width: 720px; margin: 0 auto; display: block; min-height: 48px; font-weight: 700; }
        @media (max-width: 420px) {
            .est-card { padding: 14px 12px; }
            .cat-btn { font-size: 12px; }
            .sum-row.total { font-size: 17px; }
        }
    </style>
</head>
<body>
<div class="container" style="max-width:720px">

    <div class="page-header">
        <div class="d-flex align-items-center gap-2">
            <a href="#" id="backBtn" class="btn btn-sm" style="background:#f0ebe6;color:#8b5e3c"><i class="bi bi-arrow-left"></i></a>
            <h4 class="mb-0"><i class="bi bi-file-earmark-pdf-fill me-2" style="color:#8b5e3c"></i>Invoice Generator</h4>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
            <i class="bi bi-moon-fill"></i><i class="bi bi-sun-fill"></i>
        </button>
    </div>

    <div class="est-card">
        <h6>Invoice Type</h6>
        <div class="cat-group">
            <button type="button" class="cat-btn active" data-type="poly" onclick="setType('poly')">Polymers</button>
            <button type="button" class="cat-btn" data-type="irri" onclick="setType('irri')">Irrigation</button>
        </div>
    </div>

    <div class="est-card">
        <h6>Invoice Details</h6>
        <div class="row g-2">
            <div class="col-6"><label class="form-label small fw-semibold mb-1">Invoice No.</label>
                <input id="invNo" class="form-control"></div>
            <div class="col-6"><label class="form-label small fw-semibold mb-1">Date</label>
                <input id="invDate" type="date" class="form-control"></div>
            <div class="col-6"><label class="form-label small fw-semibold mb-1">Vehicle No.</label>
                <input id="vehicle" class="form-control" value="AP02TC5634"></div>
            <div class="col-6 irri-only"><label class="form-label small fw-semibold mb-1">Transport Mode</label>
                <input id="mode" class="form-control" value="ROAD"></div>
            <div class="col-12 irri-only"><label class="form-label small fw-semibold mb-1">Place of Supply</label>
                <input id="placeSupply" class="form-control"></div>
        </div>
    </div>

    <div class="est-card">
        <h6>Buyer</h6>
        <div class="row g-2">
            <div class="col-12"><label class="form-label small fw-semibold mb-1">Name</label>
                <input id="bName" class="form-control"></div>
            <div class="col-12 irri-only"><label class="form-label small fw-semibold mb-1">Aadhar (optional)</label>
                <input id="bAadhar" class="form-control"></div>
            <div class="col-12"><label class="form-label small fw-semibold mb-1">Address</label>
                <input id="bAddr" class="form-control"></div>
            <div class="col-8"><label class="form-label small fw-semibold mb-1">State</label>
                <input id="bState" class="form-control" value="ANDHRA PRADESH"></div>
            <div class="col-4 irri-only"><label class="form-label small fw-semibold mb-1">State Code</label>
                <input id="bCode" class="form-control" value="37"></div>
        </div>
    </div>

    <div class="est-card">
        <h6>Items</h6>
        <div id="items"></div>
        <button class="btn btn-sm btn-outline-secondary" onclick="addItem()"><i class="bi bi-plus-lg"></i> Add item</button>
    </div>

    <div class="est-card">
        <h6>Other Charges &amp; GST</h6>
        <div class="row g-2">
            <div class="col-4"><label class="form-label small fw-semibold mb-1">Freight</label>
                <input id="freight" type="number" inputmode="decimal" min="0" class="form-control" oninput="calc()"></div>
            <div class="col-4"><label class="form-label small fw-semibold mb-1">Insurance</label>
                <input id="insurance" type="number" inputmode="decimal" min="0" class="form-control" oninput="calc()"></div>
            <div class="col-4"><label class="form-label small fw-semibold mb-1">Packing &amp; Fwd</label>
                <input id="packing" type="number" inputmode="decimal" min="0" class="form-control" oninput="calc()"></div>
            <div class="col-4 irri-only"><label class="form-label small fw-semibold mb-1">CGST Rate %</label>
                <input id="cgstRate" type="number" inputmode="decimal" min="0" step="any" value="0" class="form-control" oninput="calc()"></div>
            <div class="col-4 irri-only"><label class="form-label small fw-semibold mb-1">SGST Rate %</label>
                <input id="sgstRate" type="number" inputmode="decimal" min="0" step="any" value="0" class="form-control" oninput="calc()"></div>
            <div class="col-4 irri-only"><label class="form-label small fw-semibold mb-1">IGST Rate %</label>
                <input id="igstRate" type="number" inputmode="decimal" min="0" step="any" value="5" class="form-control" oninput="calc()"></div>
        </div>
    </div>

    <div class="est-card">
        <div class="sum-row"><span>Taxable value</span><b id="sTaxable">0.00</b></div>
        <div class="sum-row irri-only"><span>CGST</span><b id="sCgst">0.00</b></div>
        <div class="sum-row irri-only"><span>SGST</span><b id="sSgst">0.00</b></div>
        <div class="sum-row irri-only"><span>IGST</span><b id="sIgst">0.00</b></div>
        <div class="sum-row"><span>Total tax</span><b id="sTax">0.00</b></div>
        <div class="sum-row total"><span>Invoice total</span><span id="sTotal">₹0.00</span></div>
        <div class="small text-muted mt-1" id="sWords"></div>
    </div>
</div>

<div class="gen-bar">
    <button class="btn btn-primary w-100" onclick="generate()"><i class="bi bi-download me-1"></i>Generate PDF</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/invoice.js"></script>
</body>
</html>
